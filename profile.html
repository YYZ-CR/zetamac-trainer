<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- vercel.json rewrites /@name and /u/name to this page, and the browser
       keeps that path. Without a base, "js/profile.js" would resolve against
       /u/ and 404, leaving a blank page — this is the only page in the site
       that is ever served from a path other than the root. -->
  <base href="/">
  <title>Profile — Arithmetic Trainer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body class="profile-page">

  <div class="top-bar" id="top-bar"></div>

  <div class="profile-wrap">

    <!-- Shown until the profile resolves one way or the other -->
    <div class="profile-loading" id="profile-loading">Loading profile…</div>

    <!-- No ?u=, profile missing/private, or the database is unreachable -->
    <div class="profile-notice" id="profile-notice" style="display:none"></div>

    <div id="profile-content" style="display:none">

      <!-- Owner previewing their own unpublished profile -->
      <div class="profile-private-banner" id="owner-banner" style="display:none"></div>

      <div class="profile-head">
        <!-- Same pair of slots as dashboard.html, filled by the same function
             in js/util.js: the copy-link icon beside the name, its note (the
             private-profile caveat) underneath. -->
        <div class="identity-row">
          <h1 id="profile-name"></h1>
          <span class="share-slot" id="share-slot"></span>
        </div>
        <p class="share-note" id="share-note" role="status" aria-live="polite" style="display:none"></p>
        <div class="profile-meta" id="profile-member-since"></div>
      </div>

      <p class="profile-empty" id="profile-empty" style="display:none">
        No games recorded yet — nothing to show here until the first one is played.
      </p>

      <!-- Same structure as dashboard.html, in the same order, rendered by the
           same functions in js/stats.js: strip → score over time → by
           operation → recent games.

           Recent Games is here now, drawn from get_public_profile's `history`
           rather than from game_sessions, which a visitor cannot read. What
           crosses that boundary is per-session figures only — date, score,
           duration and a server-computed accuracy percent. The questions
           those figures came from stay on the server, and so does the session
           key, except back to the owner. See docs/social-api.md.

           The note under the strip is the dashboard's #stats-note element,
           and it carries the two figures the removed Personal Bests panel
           used to hold: the rolling average and the percentile. -->
      <div class="stat-strip" id="stat-strip" style="display:none"></div>
      <p class="stats-note" id="stats-note" style="display:none"></p>

      <!-- Same three panels as dashboard.html, in the same order, drawn by
           the same CSS. The dashboard reads game_sessions directly; this page
           gets the identical figures from get_public_profile's `history`. -->
      <div class="panel" id="chart-panel" style="display:none">
        <div class="panel-head">
          <h2>Score Over Time</h2>
          <div class="chart-range-controls">
            <button class="chart-range-btn active" data-range="20">Last 20</button>
            <button class="chart-range-btn" data-range="100">Last 100</button>
            <button class="chart-range-btn" data-range="all">All Time</button>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="profile-chart"></canvas>
        </div>
      </div>

      <div class="panel" id="ops-panel" style="display:none">
        <div class="panel-head">
          <h2>By Operation</h2>
          <span class="panel-note">Average time per question, most recent 200 games</span>
        </div>
        <div class="op-bars" id="op-bars"></div>
      </div>

      <!-- The Review column is present only on your own profile: its link
           needs a session key, and get_public_profile emits one only to the
           owner. js/profile.js removes the <th> as well as the cells, so a
           visitor gets a four-column table rather than a column of dashes. -->
      <div class="panel" id="games-panel" style="display:none">
        <div class="panel-head">
          <h2>Recent Games</h2>
          <div class="games-controls">
            Show
            <select id="page-size-select" class="page-size-select">
              <option value="10">10</option>
              <option value="20" selected>20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            per page
          </div>
        </div>
        <table class="games-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Score</th>
              <th>Duration</th>
              <th>Accuracy</th>
              <th id="games-review-th">Review</th>
            </tr>
          </thead>
          <tbody id="games-tbody"></tbody>
        </table>
        <div class="pagination-row">
          <button class="btn" id="prev-btn" disabled>&larr; Prev</button>
          <span class="page-info" id="page-info"></span>
          <button class="btn" id="next-btn">Next &rarr;</button>
        </div>
      </div>

    </div>

  </div>

  <footer class="site-footer">
    <a href="privacy.html">Privacy Policy</a>
    <span class="footer-sep" aria-hidden="true">&middot;</span>
    <a href="terms.html">Terms of Service</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <!-- Shared with dashboard.html: the stat strip and the operation bars are
       the same markup on both pages. -->
  <script src="js/stats.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
