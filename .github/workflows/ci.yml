name: CI

# Everything here was run by hand until now, which means it was run when
# somebody remembered. The three jobs are the three suites in the README, in
# increasing order of how long they take to fail.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No runtime dependencies and no lockfile to install from — `npm test`
      # runs plain node scripts. This includes the parity check that the
      # username rule in js/util.js still matches the CHECK constraint in
      # supabase/settings.sql.
      - run: npm test

  sql:
    name: SQL contract suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # run.sh rebuilds a throwaway database from the migration files, applies
      # each one twice to prove idempotency, and fails loudly on an unreadable
      # file rather than reporting a green run against a stale database.
      #
      # No ZT_SU here: the runner connects over TCP as the postgres role, so
      # there is no `su postgres` and no staging directory to make readable.
      - name: Run supabase/test/run.sh
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: supabase/test/run.sh

  browser:
    name: browser suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # python3 -m http.server, never `npx serve`: serve has clean URLs on by
      # default and silently strips the query string on its /page.html → /page
      # redirect, so the suites would pass against the wrong page state.
      - name: Serve the site
        run: |
          python3 -m http.server 8099 --bind 127.0.0.1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/index.html >/dev/null && exit 0
            sleep 1
          done
          echo "the static server never came up" >&2
          exit 1
      - run: npm run test:browser
